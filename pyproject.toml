[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterflow-reconstruction"
version = "1.0.0"
description = "Probabilistic particle observations and initial-state two-fluid reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "h5py>=3.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
counterflow = "counterflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
